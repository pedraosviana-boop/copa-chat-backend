[project]
name = "mundo-das-copas-api"
version = "1.0.0"
description = "API Flask para chatbot especialista em Copas do Mundo de futebol"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4.0",
  "Flask-Cors>=4.0,<6.0",
  "groq>=0.11,<2.0",
  "python-dotenv>=1.0,<2.0",
  "gunicorn>=22.0,<24.0",
  "Flask-Limiter>=3.8,<5.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
